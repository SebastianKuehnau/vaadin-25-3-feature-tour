spring.application.name=vaadin-25-3-feature-tour
server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin

# In-memory database for the AI data explorer demo
spring.datasource.url=jdbc:h2:mem:showcase;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# LLM for the AI demos: AI_PROVIDER=openai (default) or anthropic,
# with OPENAI_API_KEY or ANTHROPIC_API_KEY set in your environment.
spring.ai.model.chat=${AI_PROVIDER:openai}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.ai.openai.api-key=${OPENAI_API_KEY:missing}
spring.ai.openai.chat.model=gpt-5.4-mini
spring.ai.openai.chat.temperature=1

# Observability Kit 5 endpoints
management.endpoints.web.exposure.include=health,prometheus,vaadin
